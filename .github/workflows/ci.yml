name: Exercises

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run exercise tests
        # exit code 5 = no tests collected yet, which is fine early on
        run: pytest -q || [ $? -eq 5 ]
